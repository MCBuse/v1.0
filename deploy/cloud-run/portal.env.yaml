# Runtime environment for the mcbuse-portal Cloud Run service.
#
# This file is the single source of truth for the portal's configuration.
# scripts/cloud-run/deploy-portal.sh deploys it with --env-vars-file, which
# REPLACES every variable on the service. Anything changed by hand in the Cloud
# Console is lost on the next deploy, so change it here instead.
#
# The deploy script appends PORTAL_ORIGINS automatically (PORTAL_ORIGIN plus
# every Cloud Run URL of the service), so it is not listed here.
NODE_ENV: production
HOSTNAME: 0.0.0.0
SESSION_COOKIE_SECURE: "true"

# Canonical public address of the portal. Browsers send this as the Origin
# header, and the portal rejects sign-in and other mutations from any origin it
# does not trust ("Request origin is not allowed").
PORTAL_ORIGIN: https://merchant.mcbuse.com

# Server-side API endpoint (never exposed to the browser).
MCBUSE_API_URL: https://api.mcbuse.com/api/v1
