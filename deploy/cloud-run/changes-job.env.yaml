# Changes Cloud Run job (mcbuse-api-changes): overrides applied on top of api.env.yaml.
# See docs/change-intelligence-runbook.md for the job, scheduler and IAM commands.
# Stage 8: deployed only with Fred's explicit approval of that release.
# One merchant at a time; a low pool is enough (plan §8).
DATABASE_POOL_MAX: "3"
DATABASE_STATEMENT_TIMEOUT_MS: "60000"
MERCHANT_CHANGE_INTELLIGENCE_ENABLED: "true"
# Initial allowlist (plan §8, Fred 2026-10-25): MCBuse, Aci Café.
MERCHANT_CHANGE_INTELLIGENCE_ALLOWLIST: "mrc_7226ebf0b0b84c81b775,mrc_88d1fb39ebb04b24bb42"
# Optional JSON overrides of the §5.11 settings; unset = defaults.
# MERCHANT_CHANGE_INTELLIGENCE_SETTINGS: '{"minZ":2.5}'
# Processing budget per execution: 40 minutes (work stops at 80%, the rest stays queued).
CHANGE_INTELLIGENCE_BUDGET_MS: "2400000"
# Retention (only used by the --retention execution).
CHANGE_INTELLIGENCE_RETENTION_EVENT_DAYS: "90"
CHANGE_INTELLIGENCE_RETENTION_HISTORY_DAYS: "365"
CHANGE_INTELLIGENCE_RETENTION_BATCH_SIZE: "1000"
CHANGE_INTELLIGENCE_RETENTION_MAX_BATCHES: "50"
